# Generate the Xcode project with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen && cd iosApp && xcodegen
# Then open PawPixel.xcodeproj, pick your Team for both targets, and Run.
name: PawPixel
options:
  bundleIdPrefix: com.pawpixel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""          # your Apple Developer Team ID
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PawPixel:
    type: application
    platform: iOS
    sources: [iosApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawpixel.app
        PRODUCT_NAME: PawPixel
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ComposeApp"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    dependencies:
      - target: PetWidget
        embed: true
  PetWidget:
    type: app-extension
    platform: iOS
    sources: [PetWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawpixel.app.widget
        INFOPLIST_FILE: PetWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PetWidget/PetWidget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
