# Generate the Xcode project with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen && cd iosApp && xcodegen
# Then open PawPixel.xcodeproj, pick your Team for both targets, and Run.
name: PawPixel
options:
  bundleIdPrefix: com.pawpixel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""          # your Apple Developer Team ID
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PawPixel:
    type: application
    platform: iOS
    sources: [iosApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawpixel.app
        PRODUCT_NAME: PawPixel
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ComposeApp"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    dependencies:
      - target: PetWidget
        embed: true
  PawPixelUITests:
    type: bundle.ui-testing
    platform: iOS
    # The widget's model and views too, so a test can render every widget family to images.
    sources:
      - PawPixelUITests
      - PetWidget/WidgetModel.swift
      - PetWidget/PetWidgetViews.swift
      - PetWidget/sample-pet.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawpixel.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PawPixel
    dependencies:
      - target: PawPixel
  PetWidget:
    type: app-extension
    platform: iOS
    sources: [PetWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawpixel.app.widget
        INFOPLIST_FILE: PetWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PetWidget/PetWidget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  PawPixel:
    build:
      targets:
        PawPixel: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PawPixelUITests]
