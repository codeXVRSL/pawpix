<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet ID card · PawPixel</title>
<style>
  :root { --bg:#FFF8EE; --ink:#2B2135; --muted:#6E6287; --card:#fff; --line:#E6D5C3; --red:#D9574A; --green:#2FA07A; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Nunito","Segoe UI",system-ui,sans-serif; line-height:1.5; padding:16px; }
  main { max-width:560px; margin:0 auto; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; margin:12px 0; }
  h1 { font-size:28px; margin:0 0 4px; }
  .meta { color:var(--muted); font-size:14px; }
  canvas.sprite { image-rendering:pixelated; width:96px; height:96px; }
  .row { display:flex; gap:14px; align-items:center; }
  label { display:block; font-weight:800; margin-top:10px; }
  textarea, input { width:100%; box-sizing:border-box; border:2px solid var(--line); border-radius:12px; padding:10px; font:inherit; }
  button { background:var(--red); color:#fff; font-weight:800; border:0; padding:12px 18px; border-radius:999px; margin-top:10px; font:inherit; font-weight:800; }
  .hint { font-size:13px; color:var(--muted); }
  .ok { color:var(--green); font-weight:800; }
  #tag { text-align:center; }
  #tag .qr { display:inline-block; padding:8px; background:#fff; }
  @media print { body { background:#fff; padding:0 } .noprint { display:none } .card { border:1px solid #999; page-break-inside:avoid } }
</style>
</head>
<body>
<main>
  <div id="loading" class="card">Loading the card…</div>
  <div id="card" class="card" hidden>
    <div class="row"><canvas class="sprite" id="sprite" width="32" height="32" aria-hidden="true"></canvas>
      <div><h1 id="name"></h1><div class="meta" id="meta"></div></div></div>
    <p id="note"></p>
    <p class="meta" id="chip"></p>
    <form id="msg" class="noprint">
      <label for="text">Found this pet? Message the owner</label>
      <textarea id="text" rows="3" placeholder="Where they are, how they're doing" required></textarea>
      <label for="contact">How the owner can reach you (optional)</label>
      <input id="contact" placeholder="Phone or Messenger">
      <button type="submit">Send to the owner</button>
      <p class="hint">The owner gets this in PawPixel right away. Their name and number are never shown here.</p>
      <p id="sent" class="ok" hidden>Sent. Thank you for helping them home.</p>
    </form>
  </div>
  <div id="tag" class="card" hidden>
    <div class="qr" id="qr"></div>
    <div><strong id="tagname"></strong><br><span class="meta">Scan to reach my owner · PawPixel</span></div>
    <p class="noprint hint">Print this, cut it out, slip it in a tag holder on the collar. <a href="#" id="printLink">Print</a></p>
  </div>
  <div id="gone" class="card" hidden>This card doesn't exist any more.</div>
</main>
<script>/*QRCODE_JS*/</script>
<script>
const SUPABASE_URL = "/*SUPABASE_URL*/", ANON = "/*ANON_KEY*/";
const hash = location.hash.slice(1); const id = hash.split("&")[0]; const wantPrint = hash.includes("&print");
async function rpc(name, body) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, { method: "POST", headers: { apikey: ANON, Authorization: "Bearer " + ANON, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.ok ? (await r.text() || "null") : null;
}
function drawLook(look) {
  const c = document.getElementById("sprite").getContext("2d");
  const parts = (look || "").split(";"); const colours = (parts[1] || "b07a4a").split(",");
  c.fillStyle = "#" + (colours[0] || "b07a4a");
  c.fillRect(8, 8, 16, 14); c.fillRect(10, 22, 12, 6); c.fillRect(8, 4, 4, 5); c.fillRect(20, 4, 4, 5);
  c.fillStyle = "#2B2135"; c.fillRect(12, 13, 2, 2); c.fillRect(18, 13, 2, 2);
}
async function load() {
  const raw = await rpc("pet_card_public", { p_id: id }); const rows = raw ? JSON.parse(raw) : [];
  document.getElementById("loading").hidden = true;
  if (!rows.length) { document.getElementById("gone").hidden = false; return; }
  const a = rows[0];
  document.getElementById("name").textContent = a.name;
  document.getElementById("meta").textContent = a.species === "DOG" ? "Dog" : a.species === "CAT" ? "Cat" : "Pet";
  document.getElementById("note").textContent = a.note || "";
  document.getElementById("chip").textContent = a.microchip ? "Microchip " + a.microchip : "";
  drawLook(a.look);
  document.getElementById("card").hidden = false;
  const q = qrcode(0, "M"); q.addData(location.origin + location.pathname + "#" + id); q.make();
  document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 8 });
  document.getElementById("tagname").textContent = a.name;
  document.getElementById("tag").hidden = false;
  document.getElementById("printLink").onclick = (e) => { e.preventDefault(); window.print(); };
  if (wantPrint) setTimeout(() => window.print(), 300);
}
document.getElementById("msg").addEventListener("submit", async (e) => {
  e.preventDefault();
  const ok = await rpc("pet_card_message", { p_id: id, p_text: document.getElementById("text").value, p_contact: document.getElementById("contact").value });
  if (ok !== null) { document.getElementById("sent").hidden = false; document.getElementById("text").value = ""; }
  else alert("Couldn't send. Check your connection and try again.");
});
load().catch(() => { document.getElementById("loading").textContent = "Couldn't load the card. Check your connection."; });
</script>
</body>
</html>
