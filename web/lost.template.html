<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost pet · PawPixel</title>
<style>
  :root { --bg:#FFF8EE; --ink:#2B2135; --muted:#6E6287; --card:#fff; --line:#E6D5C3; --red:#D9574A; --green:#2FA07A; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; line-height:1.5; padding: 16px; }
  main { max-width: 560px; margin: 0 auto; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; margin: 12px 0; }
  h1 { font-size: 28px; margin: 0 0 4px; color: var(--red); }
  h1.found { color: var(--green); }
  .meta { color: var(--muted); font-size: 14px; }
  .photos { display:flex; gap:8px; flex-wrap:wrap; margin: 12px 0; }
  .photos img { width: calc(33% - 6px); aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  a.btn { display:inline-block; background:var(--red); color:#fff; font-weight:800; padding: 12px 18px; border-radius: 999px; text-decoration:none; margin: 6px 6px 0 0; }
  a.btn.ghost { background:#FFE9E4; color:var(--ink); }
  canvas { image-rendering: pixelated; width: 96px; height: 96px; }
  .row { display:flex; gap:14px; align-items:center; }
  .hint { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div id="loading" class="card">Loading the alert…</div>
  <div id="alert" class="card" hidden>
    <div class="row"><canvas id="sprite" width="32" height="32" aria-hidden="true"></canvas>
      <div><h1 id="title"></h1><div class="meta" id="meta"></div></div></div>
    <p id="description"></p>
    <div class="photos" id="photos"></div>
    <a class="btn" id="maps" target="_blank" rel="noopener">Where they were last seen</a>
    <a class="btn ghost" href="https://pawpixel.app/map">Seen them? Report a sighting in PawPixel</a>
    <p class="hint">The owner's name and home are never shown. Sightings reach the owner through the app. Found pets show here as found.</p>
  </div>
  <div id="gone" class="card" hidden>This alert is no longer open.</div>
</main>
<script>
const SUPABASE_URL = "/*SUPABASE_URL*/", ANON = "/*ANON_KEY*/";
const id = location.hash.slice(1);
async function load() {
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/lost_pet_public", { method: "POST", headers: { apikey: ANON, Authorization: "Bearer " + ANON, "Content-Type": "application/json" }, body: JSON.stringify({ p_id: id }) });
  const rows = r.ok ? await r.json() : [];
  document.getElementById("loading").hidden = true;
  if (!rows.length) { document.getElementById("gone").hidden = false; return; }
  const a = rows[0];
  const kind = a.species === "DOG" ? "dog" : a.species === "CAT" ? "cat" : a.species === "RABBIT" ? "rabbit" : "pet";
  const t = document.getElementById("title"); t.textContent = (a.found ? "FOUND: " : "LOST " + kind.toUpperCase() + ": ") + a.name; if (a.found) t.className = "found";
  document.getElementById("meta").textContent = "Last seen " + new Date(a.last_seen_at).toLocaleString();
  document.getElementById("description").textContent = a.description || "";
  const ph = document.getElementById("photos");
  for (const b64 of a.photos || []) { const img = document.createElement("img"); img.src = "data:image/jpeg;base64," + b64; img.alt = "Photo of " + a.name; ph.appendChild(img); }
  document.getElementById("maps").href = "https://www.google.com/maps/search/?api=1&query=" + a.last_seen_lat + "," + a.last_seen_lng;
  drawLook(a.look);
  document.getElementById("alert").hidden = false;
}
// A rough pixel pet from the look code's first colour: the app draws the real one; this page only needs a hint of it.
function drawLook(look) {
  const c = document.getElementById("sprite").getContext("2d");
  const parts = (look || "").split(";"); const colours = (parts[1] || "b07a4a").split(",");
  c.fillStyle = "#" + (colours[0] || "b07a4a");
  c.fillRect(8, 8, 16, 14); c.fillRect(10, 22, 12, 6); c.fillRect(8, 4, 4, 5); c.fillRect(20, 4, 4, 5);
  c.fillStyle = "#2B2135"; c.fillRect(12, 13, 2, 2); c.fillRect(18, 13, 2, 2);
}
load().catch(() => { document.getElementById("loading").textContent = "Couldn't load the alert. Check your connection."; });
</script>
</body>
</html>
