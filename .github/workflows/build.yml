name: Build

on:
  push:
    branches-ignore: ["ci-results/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (care, mood, sprites, animation)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # on failure, pushes the Gradle log to the ci-results/core branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          set -o pipefail
          mkdir -p diag
          ./gradlew :core:jvmTest --stacktrace 2>&1 | tee diag/gradle.txt
      - name: Publish the Gradle log (failures only)
        if: failure()
        run: |
          grep -n -E "^e: |error:|What went wrong|Exception|FAILED|\.kts:" diag/gradle.txt | head -n 200 > diag/errors.txt || true
          bash scripts/publish-results.sh diag ci-results/${{ github.ref_name == 'main' && 'core' || format('{0}-core', github.ref_name) }} "${{ github.token }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: core-test-report, path: core/build/reports/tests }

  map-backend:
    name: Map and household backend on a real Supabase stack (privacy rules)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the test log to the ci-results/backend branch
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start Supabase (database, auth, API) with the migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      - name: Play several owners through every privacy rule
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL" ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}" SERVICE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          set -o pipefail
          mkdir -p backend-out
          python3 supabase/tests/map_test.py 2>&1 | tee backend-out/map_test.txt
      - name: Play a household through every sharing rule
        if: success() || failure()
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL" ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}" SERVICE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          set -o pipefail
          mkdir -p backend-out
          python3 supabase/tests/household_test.py 2>&1 | tee backend-out/household_test.txt
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: The app's own map and family-sharing clients against the same server
        if: success() || failure()
        run: |
          set -o pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL" ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}" SERVICE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          ./gradlew :core:mapLive --quiet 2>&1 | tee backend-out/map_client_live.txt
      - name: Publish the log to the ci-results/backend branch
        if: always()
        run: |
          mkdir -p backend-out
          docker logs supabase_db_pawpixel 2>&1 | tail -n 200 > backend-out/db-log.txt || true
          bash scripts/publish-results.sh backend-out ci-results/${{ github.ref_name == 'main' && 'backend' || format('{0}-backend', github.ref_name) }} "${{ github.token }}"

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the APK to the ci-results/<branch>-apk branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: pawpixel-debug-apk, path: composeApp/build/outputs/apk/debug/*.apk }
      # Also on the ci-results/<branch>-apk branch (one commit, force-pushed), so the APK can be
      # fetched with git where the Actions artifact store can't be reached.
      - name: Publish the APK to the ci-results branch
        run: |
          mkdir -p apk-out
          cp composeApp/build/outputs/apk/debug/*.apk apk-out/
          bash scripts/publish-results.sh apk-out ci-results/${{ github.ref_name == 'main' && 'apk' || format('{0}-apk', github.ref_name) }} "${{ github.token }}"

  android-release:
    name: Android release bundle (R8, Play upload format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key from secrets (skipped if not set up yet)
        env: { KEYSTORE_B64: "${{ secrets.PAWPIXEL_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PAWPIXEL_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No PAWPIXEL_KEYSTORE_B64 secret: building an unsigned bundle."
          fi
      - name: Build release bundle and APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          PAWPIXEL_KEYSTORE_PASSWORD: ${{ secrets.PAWPIXEL_KEYSTORE_PASSWORD }}
          PAWPIXEL_KEY_ALIAS: ${{ secrets.PAWPIXEL_KEY_ALIAS }}
          PAWPIXEL_KEY_PASSWORD: ${{ secrets.PAWPIXEL_KEY_PASSWORD }}
          # Pet map (docs/MAP_SETUP.md). Unset = the map says "coming soon".
          PAWPIXEL_SUPABASE_URL: ${{ secrets.PAWPIXEL_SUPABASE_URL }}
          PAWPIXEL_SUPABASE_ANON_KEY: ${{ secrets.PAWPIXEL_SUPABASE_ANON_KEY }}
          PAWPIXEL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.PAWPIXEL_GOOGLE_WEB_CLIENT_ID }}
          PAWPIXEL_TILE_URL: ${{ secrets.PAWPIXEL_TILE_URL }}
          PAWPIXEL_TILE_ATTRIBUTION: ${{ secrets.PAWPIXEL_TILE_ATTRIBUTION }}
        run: ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease --stacktrace
      - name: Check native libraries are 16 KB aligned (Play requirement)
        run: |
          APK=$(ls composeApp/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | grep '\.so$' || echo "No native libraries."
          ZIPALIGN=$(ls $ANDROID_HOME/build-tools/*/zipalign | sort -V | tail -1)
          $ZIPALIGN -c -P 16 -v 4 "$APK" | tail -5
      - name: Report app size (bundle, APK, and the download for a budget arm64 phone)
        run: |
          AAB=$(ls composeApp/build/outputs/bundle/release/*.aab | head -1)
          APK=$(ls composeApp/build/outputs/apk/release/*.apk | head -1)
          A=$(stat -c %s "$AAB"); P=$(stat -c %s "$APK")
          DEX=$(unzip -l "$APK" | awk '/classes[0-9]*\.dex$/ {s+=$1} END {print s+0}')
          ARSC=$(unzip -l "$APK" | awk '/ resources\.arsc$/ {print $1}')
          SO=$(unzip -l "$APK" | grep -c '\.so$' || true)
          # What Play would deliver to a Realme/Oppo/Vivo-class phone: arm64, Android 11, xhdpi, English.
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          echo '{"supportedAbis":["arm64-v8a"],"supportedLocales":["en-US"],"screenDensity":320,"sdkVersion":30}' > budget-phone.json
          DL=$(java -jar bundletool.jar build-apks --bundle="$AAB" --output=app.apks --device-spec=budget-phone.json >/dev/null 2>&1 \
            && java -jar bundletool.jar get-size total --apks=app.apks --device-spec=budget-phone.json | tail -1 || echo "n/a")
          MSG="AAB ${A} B, universal APK ${P} B (dex ${DEX} B, resources.arsc ${ARSC} B, ${SO} native libs), budget-phone download MIN,MAX ${DL} B"
          echo "$MSG"
          echo "::notice title=App size::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pawpixel-release
          path: |
            composeApp/build/outputs/bundle/release/*.aab
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/mapping/release/mapping.txt

  android-e2e:
    name: Android end-to-end on an emulator (photo to pet, care, notification, widget)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # pushes screenshots and logs to the ci-results/android branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start a local map server and seed owners around Naga
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          eval "$(supabase status -o env)"
          # The emulator reaches this machine's localhost as 10.0.2.2.
          echo "PAWPIXEL_SUPABASE_URL=http://10.0.2.2:54321" >> "$GITHUB_ENV"
          echo "PAWPIXEL_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
          echo "PAWPIXEL_TEST_EMAIL=e2e@test.pawpixel" >> "$GITHUB_ENV"
          echo "PAWPIXEL_TEST_PASSWORD=e2e-pass-123" >> "$GITHUB_ENV"
          SUPABASE_URL="$API_URL" SERVICE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}" \
            TEST_EMAIL=e2e@test.pawpixel TEST_PASSWORD=e2e-pass-123 python3 supabase/tests/seed_e2e.py
      - run: ./gradlew :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest --stacktrace
      - name: Run on an Android 14 emulator
        id: e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default     # plain Android: its launcher doesn't freeze on CI like the Google one
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disable-animations: true
          script: bash scripts/android-e2e.sh e2e-out
      - name: Publish screenshots and logs to the ci-results/android branch
        if: always()
        run: bash scripts/publish-results.sh e2e-out ci-results/${{ github.ref_name == 'main' && 'android' || format('{0}-android', github.ref_name) }} "${{ github.token }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-e2e, path: e2e-out }

  ios:
    name: iOS simulator build and end-to-end UI test
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write   # pushes screenshots and logs to the ci-results/ios branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared Kotlin for iOS
        run: |
          set -o pipefail
          mkdir -p ios-out
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace 2>&1 | tee ios-out/gradle.txt || {
            grep -n -E "^e: |error:|What went wrong" ios-out/gradle.txt | head -n 100 > ios-out/errors.txt; exit 1; }
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen
      - name: Build app and widget (unsigned, simulator)
        run: |
          cd iosApp
          xcodebuild -project PawPixel.xcodeproj -target PawPixel \
            -sdk iphonesimulator -configuration Debug -arch arm64 \
            CODE_SIGNING_ALLOWED=NO build | tail -80
          test "${PIPESTATUS[0]}" -eq 0
      - name: End-to-end UI test in the Simulator (photo to pet, care, share, relaunch)
        run: |
          mkdir -p ios-out
          # A cold simulator sometimes kills the test runner while it boots: boot it first,
          # and retry once if the runner died before any test started.
          xcrun simctl boot "iPhone 16 Pro Max" || true
          xcrun simctl bootstatus "iPhone 16 Pro Max" -b || true
          cd iosApp
          for attempt in 1 2 3; do
            code=0
            rm -rf "$RUNNER_TEMP/PawPixel.xcresult"
            xcodebuild test -project PawPixel.xcodeproj -scheme PawPixel \
              -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=latest' \
              -resultBundlePath "$RUNNER_TEMP/PawPixel.xcresult" \
              CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcode-test.log" 2>&1 || code=$?
            # Retry only simulator hiccups where no test even started.
            grep -q "Test Case '-\[" "$RUNNER_TEMP/xcode-test.log" && break
            [ "$code" = 0 ] && break
            echo "The test runner never started (attempt $attempt); retrying."
            xcrun simctl shutdown all || true; xcrun simctl boot "iPhone 16 Pro Max" || true; xcrun simctl bootstatus "iPhone 16 Pro Max" -b || true
          done
          cd ..
          grep -E "error:|warning: .*PawPixel|Test Case|Test Suite|XCTAssert|failed|passed|\*\* TEST" "$RUNNER_TEMP/xcode-test.log" | tail -n 300 > ios-out/test-summary.txt || true
          tail -n 200 "$RUNNER_TEMP/xcode-test.log" > ios-out/xcode-tail.txt
          cp -R ~/pawpixel-e2e/. ios-out/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*PawPixel* ios-out/ 2>/dev/null || true   # crash reports, if any
          xcrun simctl spawn booted log show --last 20m --style compact \
            --predicate 'process == "PawPixel" AND (eventMessage CONTAINS "PawPixel" OR messageType == error OR messageType == fault) AND NOT (subsystem CONTAINS "xctest")' \
            2>/dev/null | tail -n 3000 > ios-out/app-log.txt || true
          cat ios-out/steps.txt 2>/dev/null; tail -n 30 ios-out/test-summary.txt
          exit $code
      - name: Publish screenshots and logs to the ci-results/ios branch
        if: always()
        run: bash scripts/publish-results.sh ios-out ci-results/${{ github.ref_name == 'main' && 'ios' || format('{0}-ios', github.ref_name) }} "${{ github.token }}"
