name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (care, mood, sprites, animation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:jvmTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: core-test-report, path: core/build/reports/tests }

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: pawpixel-debug-apk, path: composeApp/build/outputs/apk/debug/*.apk }

  ios:
    name: iOS simulator build (Kotlin framework + SwiftUI app + widget)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared Kotlin for iOS
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen
      - name: Build app and widget (unsigned, simulator)
        run: |
          cd iosApp
          xcodebuild -project PawPixel.xcodeproj -target PawPixel \
            -sdk iphonesimulator -configuration Debug -arch arm64 \
            CODE_SIGNING_ALLOWED=NO build | tail -80
          test "${PIPESTATUS[0]}" -eq 0
